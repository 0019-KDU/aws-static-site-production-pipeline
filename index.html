<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Banner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #070b15;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Modern ambient background ---------- */
  /* faint tech grid across the whole page */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(56,189,248,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,.045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 40%, #000 10%, transparent 80%);
  }
  /* slowly drifting colour orbs */
  .bg-orb {
    position: fixed; z-index: 0; pointer-events: none;
    border-radius: 50%; filter: blur(90px); opacity: .55;
  }
  .orb-1 { width: 520px; height: 520px; top: -160px; left: -120px;
    background: radial-gradient(circle, #38bdf8, transparent 70%); animation: drift1 16s ease-in-out infinite; }
  .orb-2 { width: 480px; height: 480px; bottom: -180px; right: -120px;
    background: radial-gradient(circle, #818cf8, transparent 70%); animation: drift2 19s ease-in-out infinite; }
  .orb-3 { width: 360px; height: 360px; top: 30%; right: 8%;
    background: radial-gradient(circle, #22d3ee, transparent 70%); opacity: .35; animation: drift1 22s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(40px,30px); } }
  @keyframes drift2 { 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(-50px,-30px); } }

  /* keep all real content above the background */
  .devops, .banner { position: relative; z-index: 2; }

  /* ---------- DevOps lifecycle diagram (top) ---------- */
  .devops { width: 100%; max-width: 1100px; }
  .devops .title {
    text-align: center;
    font-size: clamp(34px, 6vw, 60px);
    font-weight: 900;
    letter-spacing: 6px;
    color: #fff;
    position: relative;
    margin-bottom: 6px;
  }
  /* horizontal rule with a gap behind the title */
  .devops .rail {
    position: relative;
    height: 26px;
    margin: 0 24px;
    border-left: 2px solid rgba(255,255,255,.35);
    border-right: 2px solid rgba(255,255,255,.35);
  }
  .devops .rail::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0;
    border-top: 2px solid rgba(255,255,255,.35);
  }
  .stages {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 0;
  }
  .stage-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  /* vertical drop line from the rail to each icon */
  .stage-item::before {
    content: "";
    width: 2px; height: 26px;
    background: rgba(255,255,255,.3);
    margin-bottom: 14px;
  }
  .stage-item .ico {
    width: 58px; height: 58px;
    border-radius: 14px;
    display: grid; place-items: center;
    font-size: 26px;
    background: linear-gradient(135deg, rgba(56,189,248,.16), rgba(129,140,248,.16));
    border: 1px solid rgba(56,189,248,.3);
    transition: transform .15s, border-color .15s;
  }
  .stage-item:hover .ico { transform: translateY(-4px); border-color: #38bdf8; }
  .stage-item .lbl {
    margin-top: 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #9aa6bd;
    text-transform: uppercase;
  }
  @media (max-width: 720px){
    .stages { flex-wrap: wrap; gap: 18px; justify-content: center; }
    .stage-item { flex: 0 0 22%; }
    .devops .rail { display: none; }
    .stage-item::before { display: none; }
  }

  /* ---------- The Banner ---------- */
  .banner {
    position: relative;
    width: 100%;
    max-width: 1100px;
    height: 300px;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 56px;
    background:
      radial-gradient(600px 300px at 85% -20%, rgba(129,140,248,.35), transparent 60%),
      radial-gradient(500px 300px at 10% 120%, rgba(56,189,248,.30), transparent 60%),
      linear-gradient(135deg, #0d1326, #111a33 55%, #0a1020);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }

  /* grid texture */
  .banner::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(56,189,248,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,.06) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 30% 50%, #000, transparent 75%);
  }

  /* ---------- Left: text ---------- */
  .content { position: relative; z-index: 2; max-width: 560px; }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: #38bdf8; margin-bottom: 16px;
  }
  .tag .line { width: 34px; height: 2px; background: linear-gradient(90deg, #38bdf8, transparent); }

  h1 {
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800; line-height: 1.08; letter-spacing: -1px; color: #fff;
    margin-bottom: 14px;
  }
  h1 span {
    background: linear-gradient(120deg, #38bdf8, #818cf8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { color: #9aa6bd; font-size: 16px; line-height: 1.5; }

  /* ---------- Right: floating tool icons ---------- */
  .orbit { position: absolute; right: 56px; top: 0; bottom: 0; width: 360px; z-index: 1; }
  @media (max-width: 820px){ .orbit { display: none; } .banner{ padding: 0 36px; } }

  .chip {
    position: absolute;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border-radius: 14px;
    background: rgba(20,28,50,.85);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    font-size: 14px; font-weight: 600; color: #e8ecf4;
    white-space: nowrap;
    animation: float 5s ease-in-out infinite;
  }
  .chip .e { font-size: 18px; }

  .c1 { top: 50px;  left: 30px;  animation-delay: 0s;   }
  .c2 { top: 110px; left: 150px; animation-delay: .6s;  }
  .c3 { top: 30px;  right: 0;    animation-delay: 1.2s; }
  .c4 { top: 170px; left: 10px;  animation-delay: 1.8s; }
  .c5 { top: 200px; right: 20px; animation-delay: 2.4s; }
  .c6 { top: 100px; right: -10px; animation-delay: 3s;  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* dotted connectors behind chips */
  .orbit::before {
    content: "";
    position: absolute; inset: 20px;
    border: 1px dashed rgba(56,189,248,.2);
    border-radius: 50%;
  }
</style>
</head>
<body>

  <!-- Modern ambient background (behind everything) -->
  <div class="bg-grid"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- DevOps lifecycle diagram -->
  <div class="devops">
    <div class="title">DEVOPS</div>
    <div class="rail"></div>
    <div class="stages">
      <div class="stage-item"><div class="ico">📋</div><div class="lbl">Plan</div></div>
      <div class="stage-item"><div class="ico">💻</div><div class="lbl">Code</div></div>
      <div class="stage-item"><div class="ico">🧩</div><div class="lbl">Build</div></div>
      <div class="stage-item"><div class="ico">✅</div><div class="lbl">Test</div></div>
      <div class="stage-item"><div class="ico">🚀</div><div class="lbl">Release</div></div>
      <div class="stage-item"><div class="ico">🔀</div><div class="lbl">Deploy</div></div>
      <div class="stage-item"><div class="ico">⚙️</div><div class="lbl">Operate</div></div>
      <div class="stage-item"><div class="ico">🖥️</div><div class="lbl">Monitor</div></div>
    </div>
  </div>

  <div class="banner">
    <div class="content">
      <div class="tag"><span class="line"></span> DevOps &amp; Cloud Infrastructure</div>
      <h1>Automate. <span>Deploy.</span> Scale.</h1>
      <p>CI/CD pipelines, infrastructure as code, and cloud-native operations — all in one place.</p>
    </div>

    <div class="orbit">
      <div class="chip c1"><span class="e">🐳</span> Docker</div>
      <div class="chip c2"><span class="e">☸️</span> Kubernetes</div>
      <div class="chip c3"><span class="e">🌍</span> Terraform</div>
      <div class="chip c4"><span class="e">☁️</span> AWS</div>
      <div class="chip c5"><span class="e">📈</span> Prometheus</div>
      <div class="chip c6"><span class="e">🔧</span> Jenkins</div>
    </div>
  </div>
</body>
</html>
